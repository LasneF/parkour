<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parcoursup Explorer - Production Release</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased" x-data="parcoursupApp()">

    <!-- Header -->
    <header class="bg-indigo-700 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-6 flex flex-col md:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-2xl font-bold">Parcoursup Explorer Pro</h1>
                <p class="text-indigo-200 text-sm">Consultation et comparaison des formations officielles</p>
            </div>
            <div class="flex items-center gap-3">
                <span class="bg-indigo-600 px-3 py-1 rounded-full text-xs font-semibold" x-text="loading ? 'Chargement...' : filteredFormations.length + ' formations'"></span>
                <button @click="activeTab = 'search'" :class="activeTab === 'search' ? 'bg-white text-indigo-700 font-bold' : 'bg-indigo-800 text-white'" class="px-4 py-2 rounded-lg text-sm transition">Recherche</button>
                <button @click="activeTab = 'compare'" :class="activeTab === 'compare' ? 'bg-white text-indigo-700 font-bold' : 'bg-indigo-800 text-white'" class="px-4 py-2 rounded-lg text-sm transition">Comparateur (<span x-text="compareList.length"></span>/2)</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-8">

        <!-- Loading State -->
        <template x-if="loading">
            <div class="flex flex-col items-center justify-center py-20">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-700 mb-4"></div>
                <p class="text-slate-500 font-medium">Chargement et indexation des données Parcoursup...</p>
            </div>
        </template>

        <!-- Content loaded -->
        <div x-show="!loading">

            <!-- TAB 1 : SEARCH & EXPLORE -->
            <div x-show="activeTab === 'search'">
                <!-- Filters Bar -->
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">RECHERCHE RAPIDE</label>
                        <input type="text" x-model.debounce.300ms="searchQuery" placeholder="Établissement, ville, filière..." class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 mb-1">FILTRER PAR ACADÉMIE</label>
                        <select x-model="selectedAcad" class="w-full px-3 py-2 border rounded-lg text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            <option value="">Toutes les académies</option>
                            <template x-for="acad in academies" :key="acad">
                                <option x-text="acad" :value="acad"></option>
                            </template>
                        </select>
                    </div>
                    <div class="flex items-end">
                        <button @click="searchQuery = ''; selectedAcad = ''" class="w-full bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium py-2 rounded-lg text-sm transition">Réinitialiser les filtres</button>
                    </div>
                </div>

                <!-- Results Table -->
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-slate-500 text-xs uppercase tracking-wider border-b">
                                    <th class="p-4">Établissement & Ville</th>
                                    <th class="p-4">Filière</th>
                                    <th class="p-4 text-center">Capacité</th>
                                    <th class="p-4 text-center">Taux d'Accès</th>
                                    <th class="p-4 text-right">Actions</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                <template x-for="item in paginatedFormations" :key="item.id + item.filiere">
                                    <tr class="hover:bg-slate-50 transition">
                                        <td class="p-4">
                                            <div class="font-semibold text-slate-900" x-text="item.etab"></div>
                                            <div class="text-xs text-slate-500" x-text="item.ville + ' (' + item.acad + ')'"></div>
                                        </td>
                                        <td class="p-4 text-slate-700" x-text="item.filiere"></td>
                                        <td class="p-4 text-center font-medium" x-text="item.cap"></td>
                                        <td class="p-4 text-center">
                                            <span class="px-2.5 py-1 rounded-full text-xs font-bold" :class="item.taux_acc > 50 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'" x-text="item.taux_acc + '%'"></span>
                                        </td>
                                        <td class="p-4 text-right space-x-2">
                                            <button @click="openModal(item)" class="bg-indigo-50 hover:bg-indigo-100 text-indigo-700 px-3 py-1.5 rounded-lg text-xs font-semibold transition">Détails</button>
                                            <button @click="toggleCompare(item)" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition" :class="compareList.some(i => i.id === item.id && i.filiere === item.filiere) ? 'bg-rose-50 text-rose-700' : 'bg-slate-100 text-slate-700 hover:bg-slate-200'" x-text="compareList.some(i => i.id === item.id && i.filiere === item.filiere) ? 'Retirer' : 'Comparer'"></button>
                                        </td>
                                    </tr>
                                </template>
                            </tbody>
                        </table>
                    </div>
                    <!-- Pagination -->
                    <div class="p-4 bg-slate-50 border-t flex justify-between items-center">
                        <span class="text-xs text-slate-500">Affichage de <span x-text="startIndex + 1"></span> à <span x-text="Math.min(endIndex, filteredFormations.length)"></span> sur <span x-text="filteredFormations.length"></span> résultats</span>
                        <div class="space-x-2">
                            <button @click="page > 1 ? page-- : null" :disabled="page === 1" class="px-3 py-1 bg-white border rounded text-sm disabled:opacity-50">Précédent</button>
                            <span class="text-sm font-medium" x-text="page + ' / ' + maxPage"></span>
                            <button @click="page < maxPage ? page++ : null" :disabled="page >= maxPage" class="px-3 py-1 bg-white border rounded text-sm disabled:opacity-50">Suivant</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 2 : COMPARE 2 ESTABLISHMENTS -->
            <div x-show="activeTab === 'compare'" class="space-y-6">
                <div class="bg-white p-6 rounded-xl shadow-sm border border-slate-200">
                    <h2 class="text-lg font-bold text-slate-900 mb-4">Comparateur Côte à Côte</h2>
                    <template x-if="compareList.length === 0">
                        <p class="text-slate-500 text-sm">Aucune formation sélectionnée. Cliquez sur le bouton "Comparer" depuis l'onglet Recherche pour en ajouter (jusqu'à 2).</p>
                    </template>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" x-show="compareList.length > 0">
                        <template x-for="(item, index) in compareList" :key="item.id">
                            <div class="border rounded-xl p-5 bg-slate-50 relative">
                                <button @click="compareList.splice(index, 1)" class="absolute top-4 right-4 text-rose-600 text-xs font-bold bg-white px-2 py-1 border rounded shadow-sm">Supprimer</button>
                                <h3 class="font-bold text-lg text-slate-900" x-text="item.etab"></h3>
                                <p class="text-xs text-slate-500 mb-4" x-text="item.ville + ' • ' + item.filiere"></p>
                                <div class="space-y-3 text-sm">
                                    <div class="flex justify-between bg-white p-2.5 rounded border">
                                        <span class="text-slate-500">Capacité d'accueil :</span>
                                        <span class="font-semibold" x-text="item.cap"></span>
                                    </div>
                                    <div class="flex justify-between bg-white p-2.5 rounded border">
                                        <span class="text-slate-500">Vœux formulés :</span>
                                        <span class="font-semibold" x-text="item.voeux"></span>
                                    </div>
                                    <div class="flex justify-between bg-white p-2.5 rounded border">
                                        <span class="text-slate-500">Taux d'accès :</span>
                                        <span class="font-bold text-indigo-600" x-text="item.taux_acc + '%'"></span>
                                    </div>
                                    <div class="flex justify-between bg-white p-2.5 rounded border">
                                        <span class="text-slate-500">Boursiers :</span>
                                        <span class="font-semibold" x-text="item.boursiers + '%'"></span>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Modal Details -->
    <div x-show="modalOpen" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50" x-cloak>
        <div class="bg-white rounded-2xl max-w-2xl w-full p-6 shadow-xl border border-slate-100 max-h-[90vh] overflow-y-auto" @click.outside="modalOpen = false">
            <template x-if="selectedItem">
                <div>
                    <!-- Header -->
                    <div class="flex justify-between items-start mb-6">
                        <div>
                            <h2 class="text-xl font-bold text-slate-900" x-text="selectedItem.etab"></h2>
                            <p class="text-sm text-indigo-600 font-medium" x-text="selectedItem.filiere"></p>
                            <p class="text-xs text-slate-500" x-text="selectedItem.ville + ' (' + selectedItem.acad + ')'"></p>
                        </div>
                        <button @click="modalOpen = false" class="text-slate-400 hover:text-slate-600 text-lg font-bold">&times;</button>
                    </div>

                    <!-- Indicateurs clés -->
                    <div class="grid grid-cols-3 gap-4 mb-6 text-center">
                        <div class="bg-slate-50 p-3 rounded-xl border">
                            <div class="text-xs text-slate-500 font-medium">Capacité</div>
                            <div class="text-lg font-bold text-slate-900" x-text="selectedItem.cap"></div>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border">
                            <div class="text-xs text-slate-500 font-medium">Taux d'accès</div>
                            <div class="text-lg font-bold text-indigo-600" x-text="selectedItem.taux_acc + '%'"></div>
                        </div>
                        <div class="bg-slate-50 p-3 rounded-xl border">
                            <div class="text-xs text-slate-500 font-medium">Boursiers</div>
                            <div class="text-lg font-bold text-slate-900" x-text="selectedItem.boursiers + '%'"></div>
                        </div>
                    </div>

                    <!-- Graphique Histogramme -->
                    <div class="border-t pt-4">
                        <h4 class="text-sm font-bold text-slate-700 mb-3">Répartition des mentions au bac des admis (du plus bas au plus haut)</h4>
                        <div class="relative h-64 w-full">
                            <canvas id="mentionChart"></canvas>
                        </div>
                    </div>

                    <!-- Footer Actions -->
                    <div class="mt-6 pt-4 border-t flex justify-end gap-3">
                        <button @click="modalOpen = false" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-lg text-sm font-semibold transition">Fermer</button>
                        <button @click="toggleCompare(selectedItem); modalOpen = false" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg text-sm font-semibold transition">Comparer cet établissement</button>
                    </div>
                </div>
            </template>
        </div>
    </div>

    <!-- Application Logic -->
    <script>
        function parcoursupApp() {
            return {
                loading: true,
                formations: [],
                searchQuery: '',
                selectedAcad: '',
                activeTab: 'search',
                page: 1,
                perPage: 15,
                compareList: [],
                modalOpen: false,
                selectedItem: null,
                chartInstance: null,

                async init() {
                    console.log("🔄 Début du chargement de data.json...");
                    try {
                        const response = await fetch('data.json');
                        if (!response.ok) throw new Error(`Erreur HTTP: ${response.status}`);
                        this.formations = await response.json();
                        console.log(`✅ Données chargées avec succès : ${this.formations.length} formations.`);
                        if (this.formations.length > 0) {
                            console.log("🔍 Exemple de formation chargée (index 0) :", this.formations[0]);
                        }
                    } catch (e) {
                        console.error('❌ ERREUR lors du chargement de data.json :', e);
                    } finally {
                        this.loading = false;
                    }
                },

                get academies() {
                    return [...new Set(this.formations.map(f => f.acad))].filter(Boolean).sort();
                },

                get filteredFormations() {
                    return this.formations.filter(f => {
                        const matchesQuery = this.searchQuery === '' || 
                            f.etab.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                            f.ville.toLowerCase().includes(this.searchQuery.toLowerCase()) ||
                            f.filiere.toLowerCase().includes(this.searchQuery.toLowerCase());
                        const matchesAcad = this.selectedAcad === '' || f.acad === this.selectedAcad;
                        return matchesQuery && matchesAcad;
                    });
                },

                get maxPage() {
                    return Math.ceil(this.filteredFormations.length / this.perPage) || 1;
                },

                get startIndex() {
                    return (this.page - 1) * this.perPage;
                },

                get endIndex() {
                    return this.startIndex + this.perPage;
                },

                get paginatedFormations() {
                    return this.filteredFormations.slice(this.startIndex, this.endIndex);
                },

                toggleCompare(item) {
                    const idx = this.compareList.findIndex(i => i.id === item.id && i.filiere === item.filiere);
                    if (idx > -1) {
                        this.compareList.splice(idx, 1);
                    } else {
                        if (this.compareList.length >= 2) {
                            alert('Vous pouvez comparer au maximum 2 établissements simultanément.');
                            return;
                        }
                        this.compareList.push(item);
                    }
                },

                openModal(item) {
                    console.log("🔍 Ouverture de la modale pour :", item.etab, item);
                    this.selectedItem = item;
                    this.modalOpen = true;
                    this.$nextTick(() => this.renderChart(item));
                },

                renderChart(item) {
                    const canvasEl = document.getElementById('mentionChart');
                    if (!canvasEl) {
                        console.error("❌ Élément canvas 'mentionChart' introuvable !");
                        return;
                    }
                    const ctx = canvasEl.getContext('2d');
                    if (this.chartInstance) {
                        this.chartInstance.destroy();
                    }
                    const m = item.mentions || {};
                    console.log("📊 Données de mentions pour le graphique :", m);

                    const labels = ['Sans mention', 'Assez Bien', 'Bien', 'Très Bien', 'Très Bien + Félicitations'];
                    const dataValues = [m.sans || 0, m.ab || 0, m.b || 0, m.tb || 0, m.tb_fel || 0];

                    this.chartInstance = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: labels,
                            datasets: [{
                                label: 'Part des admis (%)',
                                data: dataValues,
                                backgroundColor: ['#94a3b8', '#93c5fd', '#60a5fa', '#3b82f6', '#4f46e5'],
                                borderRadius: 6
                            }]
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: {
                                legend: { display: false }
                            },
                            scales: {
                                y: {
                                    beginAtZero: true,
                                    ticks: {
                                        callback: function(value) {
                                            return value + '%';
                                        }
                                    }
                                }
                            }
                        }
                    });
                }
            }
        }
    </script>
</body>
</html>
