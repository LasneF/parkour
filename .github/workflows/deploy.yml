name: CI/CD Pipeline Parcoursup

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: write  # Nécessaire si vous voulez que l'action pousse le data.json généré automatiquement
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run build script & test output
        run: |
          echo "Vérification de la présence du CSV..."
          if [ -f "fr-esr-parcoursup.csv" ]; then
            echo "Fichier CSV trouvé. Exécution du script de build..."
            python build.py
            
            echo "Test de validation du data.json généré..."
            if [ -f "data.json" ]; then
              # Test basique : vérifie que le fichier JSON fait plus de 1 Ko et n'est pas vide
              file_size=$(stat -c%s "data.json")
              if [ "$file_size" -gt 1024 ]; then
                echo "Succès : data.json généré avec succès ($file_size octets)."
              else
                echo "Erreur : Le fichier data.json généré est anormalement petit ou vide."
                exit 1
              fi
            else
              echo "Erreur : Le fichier data.json n'a pas été créé."
              exit 1
            fi
          else
            echo "Attention : fr-esr-parcoursup.csv absent. Le build est ignoré."
          fi

      # Si on est sur main (après merge ou push direct), on déploie sur GitHub Pages
      - name: Setup Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v4

      - name: Upload artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: deployment
        uses: actions/deploy-pages@v4
